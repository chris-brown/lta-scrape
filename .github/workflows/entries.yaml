name: LTA Daily Entry Lists

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at UTC08:00
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  entries-scrape:
    name: Scrape entry lists
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Create files directory
        run: mkdir -p files
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Download tournaments.csv from Azure
        run: |
          az storage blob download --account-name ltascrape --container-name files --name tournaments.csv --file files/tournaments.csv --auth-mode login
          az storage blob download --account-name ltascrape --container-name files --name combined.csv --file files/combined.csv --auth-mode login
      - name: Cypress entries scrape
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/entries.cy.js
          browser: chrome
      - name: Archive entries
        uses: actions/upload-artifact@v4
        with:
          name: entries-results
          path: files/entries.csv
      - name: Azure login (refresh)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Upload entries to Azure
        run: az storage blob upload --account-name ltascrape --container-name files --name entries.csv --file files/entries.csv --overwrite --auth-mode login