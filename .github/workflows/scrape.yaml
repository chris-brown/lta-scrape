name: LTA Weekly Rankings & Tournaments

on:
  schedule:
    - cron: '0 11 * * FRI'  # At UTC11:00 on Friday
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cypress-run:
    name: Cypress scrape
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Cypress rankings scrape
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/lta-website.cy.js
      - name: Cypress tournaments scrape
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/tournaments.cy.js
          install: false
        env:
          CYPRESS_POSTCODE: ${{ secrets.POSTCODE }}
      - name: Archive Cypress Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            files/combined.csv
            files/u9.csv
            files/u10.csv
            files/tournaments.csv
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Upload to storage container
        run: az storage blob upload-batch --account-name ltascrape --destination files --source files --pattern '*.csv' --overwrite --auth-mode login